name: 趣连 Auto Fetch (手动版)

on:
  workflow_dispatch:        # 仅保留手动触发

jobs:
  update-nodes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        # 移除了 tesseract 相关的包，强制脚本使用识别率极高的 ddddocr
        run: |
          pip install pycryptodome pillow ddddocr

      - name: Run Fetch Script
        run: |
          python "趣连全自动 (2).py"

      - name: Commit and Push Nodes
        run: |
          mkdir -p subscribe
          cp ~/Downloads/趣连.txt ./subscribe/qulian_nodes.txt
          
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add ./subscribe/qulian_nodes.txt
          git commit -m "Manual update Qulian nodes [skip ci]" || exit 0
          git push
